# Runs the type check and all three test suites on every push and pull request (see tests/ and CLAUDE.md "Verifying changes").
name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4 # the Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: syntax
        run: for f in ../js/*.js ../sw.js; do node --check "$f"; done
      - run: npm run test:types
      - run: npm run test:unit
      - run: npm run test:rules
      - run: npm run test:ui
