<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בינגו משפחתי</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#1d2a44;--muted:#5d6b82;--line:#d3dae5;--dab:#ffcf33;--hot:#e4572e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131a26;--card:#1e2736;--ink:#e8edf5;--muted:#9aa7bb;--line:#2e3a4d;--dab:#e0b21c;--hot:#ff7a54}}
:root[data-theme="dark"]{--bg:#131a26;--card:#1e2736;--ink:#e8edf5;--muted:#9aa7bb;--line:#2e3a4d;--dab:#e0b21c;--hot:#ff7a54}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Assistant,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto;padding:16px 16px 0}
h1,.big{font-family:"Secular One",Assistant,sans-serif;font-weight:400;margin:0}
h1{font-size:30px}
h2{font-size:19px;margin:24px 0 8px}
button,select,textarea{font:inherit;color:inherit}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
button.ghost{background:none;color:var(--muted);border:1px solid var(--line);padding:6px 12px;font-weight:600}
button:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{resize:vertical;min-height:70px}
.names{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.names button{padding:18px;font-size:20px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.muted{color:var(--muted);font-size:15px}
.counts{display:flex;flex-wrap:wrap;gap:6px}
.counts span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:14px}
ul{list-style:none;margin:0;padding:0}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
li .t{flex:1}
li b{margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cell{aspect-ratio:1;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:clamp(12px,3.6vw,16px);line-height:1.25;cursor:pointer;user-select:none;overflow:hidden;transition:background .15s}
.cell small{display:block;color:var(--muted);font-size:.8em;margin-top:4px}
.cell.on{background:radial-gradient(circle,var(--dab) 0 60%,var(--card) 61%);color:#1d2a44}
.cell.on small{color:#1d2a44}
.cell.line{border-color:var(--hot)}
.score li{align-items:center}
.tag{color:var(--hot);font-weight:700}
.admin{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:24px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--hot);color:#fff;padding:12px 20px;border-radius:12px;font-family:"Secular One",sans-serif;font-size:20px;transition:transform .3s;z-index:9}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>בינגו משפחתי</h1><button class="ghost" id="who" hidden></button></header>
<main id="app"><p class="muted">טוען…</p></main>
<div id="toast" role="status"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvZu7ozy2-NFuE1ysuIU_EnFbO12LntVE",
  authDomain: "family-bingo-4c8e7.firebaseapp.com",
  projectId: "family-bingo-4c8e7",
  storageBucket: "family-bingo-4c8e7.firebasestorage.app",
  messagingSenderId: "564240750544",
  appId: "1:564240750544:web:706f367543d2903c660bd5"
};

const PLAYERS = ["אבא", "אמא", "מתן", "אורי", "עדי", "הדר"];
const N = 9;
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

const db = getFirestore(initializeApp(firebaseConfig));
const isAdmin = new URLSearchParams(location.search).has("admin");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let me = localStorage.getItem("bingo-me");
let items = [], game = { status: "entry", cards: {} }, marks = {}, loaded = 0, view = "";
const prev = {};

onSnapshot(collection(db, "items"), s => { items = s.docs.map(d => ({ id: d.id, ...d.data() })); ready(); });
onSnapshot(doc(db, "game", "state"), s => { game = s.data() || { status: "entry", cards: {} }; ready(); });
onSnapshot(collection(db, "marks"), s => {
  marks = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
  for (const [p, m] of Object.entries(marks)) {
    const was = prev[p];
    if (was && !was.bingo && m.bingo) toast(`${p}: בינגו!`);
    if (was && !was.blackout && m.blackout) toast(`${p}: כרטיס מלא! 🏆`);
    prev[p] = { bingo: m.bingo, blackout: m.blackout };
  }
  ready();
});
function ready() { if (++loaded >= 3) render(); }

// ---- selection: weighted sample without replacement (weight defaults to 1) ----
function pick(pool, k) {
  pool = pool.map(i => ({ id: i.id, w: i.weight ?? 1 }));
  const out = [];
  while (out.length < k) {
    let r = Math.random() * pool.reduce((s, p) => s + p.w, 0);
    let j = pool.findIndex(p => (r -= p.w) < 0);
    if (j < 0) j = pool.length - 1;
    out.push(pool.splice(j, 1)[0].id);
  }
  return out;
}
const poolFor = p => items.filter(i => i.about !== p);

async function generate() {
  const short = PLAYERS.filter(p => poolFor(p).length < N);
  if (short.length) return alert(`חסרים משפטים שאינם על: ${short.join(", ")} (צריך לפחות ${N} לכל אחד)`);
  if (!confirm("ליצור כרטיסים ולנעול את ההזנה?")) return;
  const b = writeBatch(db);
  const cards = Object.fromEntries(PLAYERS.map(p => [p, pick(poolFor(p), N)]));
  b.set(doc(db, "game", "state"), { status: "play", cards, at: serverTimestamp() });
  PLAYERS.forEach(p => b.set(doc(db, "marks", p), { marked: [], bingo: false, blackout: false }));
  await b.commit();
}
async function reset() {
  if (!confirm("למחוק את הכרטיסים ולחזור להזנה? המשפטים נשמרים.")) return;
  const b = writeBatch(db);
  b.set(doc(db, "game", "state"), { status: "entry", cards: {} });
  PLAYERS.forEach(p => b.set(doc(db, "marks", p), { marked: [], bingo: false, blackout: false }));
  await b.commit();
}

// ---- render ----
function render() {
  const who = $("#who");
  who.hidden = !me; who.textContent = me ? `${me} · החלף` : "";
  who.onclick = () => { localStorage.removeItem("bingo-me"); me = null; render(); };

  const key = `${me}|${game.status}`;
  if (key !== view) { view = key; $("#app").innerHTML = !me ? pickView() : game.status === "play" ? playView() : entryView(); bind(); }
  if (!me) return;
  if (game.status === "play") fillPlay(); else fillEntry();
  if (isAdmin) fillAdmin();
}

const pickView = () => `<h2>מי אתה?</h2><div class="names">${PLAYERS.map(p => `<button data-me="${esc(p)}">${esc(p)}</button>`).join("")}</div>`;

const adminBox = () => isAdmin ? `<section class="admin"><h2>מסך מתכלל</h2><div id="adm"></div></section>` : "";

const entryView = () => `
  <h2>משפט חדש</h2>
  <form id="add">
    <select id="about" required><option value="">על מי?</option>${PLAYERS.filter(p => p !== me).map(p => `<option>${esc(p)}</option>`).join("")}</select>
    <div class="row"><textarea id="text" required maxlength="140" placeholder="מה הוא יגיד או יעשה?"></textarea></div>
    <div class="row"><button>הוסף</button></div>
  </form>
  <h2>כמה משפטים יש על כל אחד</h2><div class="counts" id="counts"></div>
  <h2>המשפטים</h2><p class="muted">משפטים שנכתבו עליך מוסתרים.</p><ul id="list"></ul>
  ${adminBox()}`;

const playView = () => `
  <p class="muted">מסמנים משבצת כשזה קורה. שורה, עמודה או אלכסון = בינגו. כל 9 = ניצחון.</p>
  <div class="grid" id="card"></div>
  <h2>מצב המשחק</h2><ul class="score" id="score"></ul>
  ${adminBox()}`;

function fillEntry() {
  $("#counts").innerHTML = PLAYERS.map(p => `<span>${esc(p)}: ${items.filter(i => i.about === p).length}</span>`).join("");
  const vis = items.filter(i => i.about !== me).sort((a, b) => (b.at?.seconds ?? 9e9) - (a.at?.seconds ?? 9e9));
  $("#list").innerHTML = vis.map(i => `<li><span class="t"><b>${esc(i.about)}</b>${esc(i.text)}<br><span class="muted">כתב/ה: ${esc(i.author)}</span></span>${i.author === me ? `<button class="ghost" data-del="${i.id}">מחק</button>` : ""}</li>`).join("") || `<li class="muted">עוד אין משפטים. תתחיל!</li>`;
}

function fillPlay() {
  const ids = game.cards?.[me] || [];
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  const on = new Set(marks[me]?.marked || []);
  const hot = new Set(LINES.filter(l => l.every(k => on.has(ids[k]))).flat());
  $("#card").innerHTML = ids.map((id, k) => {
    const i = byId[id] || { text: "(נמחק)", about: "" };
    return `<div class="cell${on.has(id) ? " on" : ""}${hot.has(k) ? " line" : ""}" role="button" tabindex="0" aria-pressed="${on.has(id)}" data-cell="${id}">${esc(i.text)}<small>${esc(i.about)}</small></div>`;
  }).join("");
  $("#score").innerHTML = PLAYERS.map(p => {
    const m = marks[p] || {};
    return `<li><span class="t">${esc(p)}</span><span class="muted">${(m.marked || []).length}/${N}</span>${m.blackout ? `<span class="tag">🏆 מלא</span>` : m.bingo ? `<span class="tag">בינגו</span>` : ""}</li>`;
  }).join("");
}

function fillAdmin() {
  $("#adm").innerHTML = game.status === "play"
    ? `<p class="muted">המשחק רץ.</p><button class="ghost" id="reset">אפס כרטיסים</button>`
    : `<div class="counts">${PLAYERS.map(p => `<span>לכרטיס של ${esc(p)}: ${poolFor(p).length}</span>`).join("")}</div>
       <div class="row"><button id="gen">צור כרטיסים והתחל</button></div>`;
  $("#gen")?.addEventListener("click", generate);
  $("#reset")?.addEventListener("click", reset);
}

async function toggle(id) {
  const ids = game.cards[me];
  const on = new Set(marks[me]?.marked || []);
  on.has(id) ? on.delete(id) : on.add(id);
  const bingo = LINES.some(l => l.every(k => on.has(ids[k])));
  await setDoc(doc(db, "marks", me), { marked: [...on], bingo, blackout: on.size === N });
}

function bind() {
  const app = $("#app");
  app.onclick = e => {
    const t = e.target.closest("[data-me],[data-del],[data-cell]");
    if (!t) return;
    if (t.dataset.me) { me = t.dataset.me; localStorage.setItem("bingo-me", me); render(); }
    else if (t.dataset.del && confirm("למחוק?")) deleteDoc(doc(db, "items", t.dataset.del));
    else if (t.dataset.cell) toggle(t.dataset.cell);
  };
  app.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.cell) { e.preventDefault(); toggle(e.target.dataset.cell); } };
  $("#add")?.addEventListener("submit", async e => {
    e.preventDefault();
    const text = $("#text").value.trim(), about = $("#about").value;
    if (!text || !about) return;
    $("#text").value = "";
    await addDoc(collection(db, "items"), { text, about, author: me, weight: 1, at: serverTimestamp() });
  });
}

let tt;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 4000); }
</script>
</body>
</html>
